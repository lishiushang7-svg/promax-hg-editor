<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Promax 心金存檔編輯器</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071022;color:#f3f6ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}header{padding:22px 18px 14px;background:#0c1426;position:sticky;top:0;z-index:5;border-bottom:1px solid #263453}h1{font-size:24px;margin:0 0 5px}.sub{color:#9aa7c3;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}button,.filebtn{border:1px solid #304265;background:#182541;color:#fff;border-radius:12px;padding:11px 14px;font-size:15px}.primary{background:#1769d1;border-color:#2c83ee}.good{background:#13834c;border-color:#24b96f}.danger{background:#9b2530}.filebtn input{display:none}.status{padding:11px 13px;background:#111b31;border:1px solid #293a5e;border-radius:12px;color:#b7c4df;margin-bottom:12px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap}.tab.active{background:#1769d1}.card{background:#111a2e;border:1px solid #2a3a5e;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field label{display:block;color:#aab7d1;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;background:#091226;color:#fff;border:1px solid #33486e;border-radius:9px;padding:10px;font-size:15px}.wide{grid-column:1/-1}.partygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{background:#0b1528;border:1px solid #2b3d61;border-radius:12px;padding:10px;text-align:left}.slot.sel{border-color:#3b8df5;background:#10254a}.muted{color:#91a0bd}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.check{display:flex;gap:8px;align-items:center}.check input{width:20px;height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1c2b49;color:#a9c8ff;margin-right:5px;font-size:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}.partygrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>Promax 心金存檔編輯器</h1><div class="sub">iPhone Safari 可用・直接編輯 .dsv / .sav・不需要上傳伺服器</div></header>
<div class="wrap">
<div class="toolbar"><label class="filebtn primary">📂 開啟存檔<input id="file" type="file" accept=".dsv,.sav,.dat,.bin"></label><button id="export" class="good" disabled>💾 匯出修改後存檔</button><button id="backup">↩️ 還原本次修改</button></div>
<div id="status" class="status">請選擇你的 <b>promax.dsv</b> 或 .sav 存檔。</div>
<div id="app" class="hidden">
<div class="tabs"><button class="tab active" data-tab="party">⚔️ 隊伍</button><button class="tab" data-tab="boxes">📦 盒子</button><button class="tab" data-tab="bag">🎒 背包</button><button class="tab" data-tab="trainer">👤 玩家</button></div>
<section id="party" class="panel"></section><section id="boxes" class="panel hidden"></section><section id="bag" class="panel hidden"></section><section id="trainer" class="panel hidden"></section>
</div></div>
<script>
const ORDER=['ABCD','ABDC','ACBD','ACDB','ADBC','ADCB','BACD','BADC','BCAD','BCDA','BDAC','BDCA','CABD','CADB','CBAD','CBDA','CDAB','CDBA','DABC','DACB','DBAC','DBCA','DCAB','DCBA'];
let original=null,data=null,fileName='promax.dsv',baseSel=0,selected={type:'party',index:0};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const u16=(a,o)=>a[o]|(a[o+1]<<8), u32=(a,o)=>((a[o]|(a[o+1]<<8)|(a[o+2]<<16)|(a[o+3]<<24))>>>0);
function w16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255} function w32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
function crypt(a,seed){for(let i=0;i<128;i+=2){seed=(Math.imul(0x41C64E6D,seed)+0x6073)>>>0;const x=seed>>>16;a[i]^=x&255;a[i+1]^=x>>>8}}
function decryptPK(enc){let d=new Uint8Array(enc),pid=u32(d,0),chk=u16(d,6),sv=((pid>>>13)&31)%24,sh=d.slice(8,136),out=new Uint8Array(128);crypt(sh,chk);for(let i=0;i<4;i++){const pi=ORDER[sv].charCodeAt(i)-65;out.set(sh.slice(i*32,i*32+32),pi*32)}d.set(out,8);return d}
function encryptPK(dec){let d=new Uint8Array(dec),pid=u32(d,0),chk=u16(d,6),sv=((pid>>>13)&31)%24,sh=new Uint8Array(128);for(let i=0;i<4;i++){const pi=ORDER[sv].charCodeAt(i)-65;sh.set(d.slice(8+pi*32,8+pi*32+32),i*32)}crypt(sh,chk);d.set(sh,8);return d}
function checksum(a){let s=0;for(let i=8;i<136;i+=2)s=(s+u16(a,i))&65535;return s}
function refresh(a){w16(a,6,checksum(a));}
function pkOffset(type,index){if(type==='party')return 0x98+index*236;return 0xF700+index*0x1000+Math.floor((selected.index%30))*136}
function boxOffset(box,slot){return 0xF700+box*0x1000+slot*136}
function getPK(type,index){const off=type==='party'?0x98+index*236:boxOffset(Math.floor(index/30),index%30);return decryptPK(data.slice(baseSel+off,baseSel+off+136))}
function setPK(type,index,pk){const off=type==='party'?0x98+index*236:boxOffset(Math.floor(index/30),index%30);const e=encryptPK(pk);data.set(e,baseSel+off); if(data.length>=0x80000){const other=baseSel===0?0x40000:0;data.set(e,other+off)} }
function isPK(pk){const sp=u16(pk,8);return sp!==0 || u32(pk,0)!==0}
function shiny(pk){const tid=u16(pk,12),sid=u16(pk,14),pid=u32(pk,0);return ((((pid>>>16)^pid^tid^sid)>>>0)&0xFFFF)<8}
function setShiny(pk,on){const tid=u16(pk,12),sid=u16(pk,14),old=u32(pk,0),nature=old%25,hi=old>>>16;for(let lo=0;lo<65536;lo++){const pid=((hi<<16)|lo)>>>0;if(pid%25===nature){const sv=(((pid>>>16)^pid^tid^sid)&65535);if((sv<8)===on){w32(pk,0,pid);return}}}}
function ensurePK(pk){if(!isPK(pk)){crypto.getRandomValues(pk);pk.fill(0,0,8);w32(pk,0,(Math.floor(Math.random()*0xffffffff))>>>0);w16(pk,4,0);w16(pk,8,1);w16(pk,12,u16(data,baseSel+0x74));w16(pk,14,u16(data,baseSel+0x76));w32(pk,0x10,0);w16(pk,0x0A,0);w16(pk,0x28,0);w16(pk,0x2A,0);w16(pk,0x2C,0);w16(pk,0x2E,0);pk[0x15]=0;}}
function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||0))}
function render(){renderParty();renderBoxes();renderBag();renderTrainer();}
function field(label,key,value,type='number',min=0,max=65535){return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" value="${type==='number'?value:(value||'')}" ${type==='number'?`min="${min}" max="${max}"`:''}></div>`}
function renderParty(){let p=data[baseSel+0x94]||0;let h='<div class="card"><div class="row"><div><b>目前隊伍</b><div class="muted small">遊戲存檔中的 6 格隊伍・目前數量：'+p+'</div></div></div><div class="partygrid" style="margin-top:10px">';for(let i=0;i<6;i++){let pk=getPK('party',i),sp=u16(pk,8),pid=u32(pk,0);h+=`<button class="slot ${selected.type==='party'&&selected.index===i?'sel':''}" onclick="selectPK('party',${i})"><b>第 ${i+1} 隻</b><br>${sp?'寶可夢 ID '+sp:'空位'}<br><span class="muted small">${sp?'PID '+pid.toString(16).padStart(8,'0'):''}</span></button>`}h+='</div></div>';
if(selected.type==='party'){h+=editorCard('party',selected.index)}$('#party').innerHTML=h}
function renderBoxes(){let box=selected.type==='box'?Math.floor(selected.index/30):0;let h='<div class="card"><div class="row"><div><b>PC 盒子</b><div class="muted small">18 個盒子・每盒 30 格</div></div><select id="boxsel" onchange="pickBox(this.value)">';for(let b=0;b<18;b++)h+=`<option value="${b}" ${b===box?'selected':''}>盒子 ${b+1}</option>`;h+='</select></div><div class="partygrid" style="margin-top:10px">';for(let s=0;s<30;s++){let idx=box*30+s,pk=getPK('box',idx),sp=u16(pk,8);h+=`<button class="slot ${selected.type==='box'&&selected.index===idx?'sel':''}" onclick="selectPK('box',${idx})"><b>${s+1}</b><br>${sp?'ID '+sp:'空'}</button>`}h+='</div></div>';if(selected.type==='box')h+=editorCard('box',selected.index);$('#boxes').innerHTML=h}
function pickBox(v){selected={type:'box',index:Number(v)*30};renderBoxes()}
function selectPK(t,i){selected={type:t,index:i};render();if(t==='box')document.querySelector('[data-tab="boxes"]').click()}
window.selectPK=selectPK;window.pickBox=pickBox;
function editorCard(type,index){let pk=getPK(type,index),exists=isPK(pk);if(!exists)ensurePK(pk);let sp=u16(pk,8),item=u16(pk,10),exp=u32(pk,0x10),moves=[0x28,0x2A,0x2C,0x2E].map(o=>u16(pk,o)),ev=[0x18,0x19,0x1A,0x1B,0x1C,0x1D].map(o=>pk[o]),iv32=u32(pk,0x38),ivs=[iv32&31,(iv32>>>5)&31,(iv32>>>10)&31,(iv32>>>15)&31,(iv32>>>20)&31,(iv32>>>25)&31],ability=pk[0x15],friend=pk[0x14],gender=(pk[0x40]>>1)&3,form=pk[0x40]>>3,nat=u32(pk,0)%25;
return `<div class="card"><div class="row"><div><b>${exists?'編輯':'建立'}寶可夢</b><div class="muted small">${type==='party'?'隊伍第 '+(index+1)+' 格':'盒子 '+(Math.floor(index/30)+1)+'／第 '+(index%30+1)+' 格'}</div></div><span class="pill">Nature ${nat}</span><span class="pill">${shiny(pk)?'✨ 閃光':''}</span></div><div class="grid" style="margin-top:12px">${field('寶可夢 ID','species',sp, 'number',0,65535)}${field('持有道具 ID','item',item)}${field('經驗值 EXP','exp',exp,'number',0,4294967295)}${field('特性 ID','ability',ability,'number',0,255)}${field('親密度','friend',friend,'number',0,255)}${field('性別 0男/1女/2無性別','gender',gender,'number',0,2)}${field('型態 Form','form',form,'number',0,31)}${field('TID','tid',u16(pk,12),'number',0,65535)}${field('SID','sid',u16(pk,14),'number',0,65535)}${field('招式 1 ID','m1',moves[0])}${field('招式 2 ID','m2',moves[1])}${field('招式 3 ID','m3',moves[2])}${field('招式 4 ID','m4',moves[3])}</div><div class="card" style="margin:12px 0 0"><b>IV（0～31）</b><div class="grid3" style="margin-top:9px">${['HP','攻擊','防禦','速度','特攻','特防'].map((x,i)=>field(x,'iv'+i,ivs[i],'number',0,31)).join('')}</div></div><div class="card" style="margin:12px 0 0"><b>EV（0～255）</b><div class="grid3" style="margin-top:9px">${['HP','攻擊','防禦','速度','特攻','特防'].map((x,i)=>field(x,'ev'+i,ev[i],'number',0,255)).join('')}</div></div><div class="actions"><button class="primary" onclick="applyPK('${type}',${index})">✅ 套用修改</button><button onclick="setPKShiny('${type}',${index},true)">✨ 設為閃光</button><button onclick="setPKShiny('${type}',${index},false)">取消閃光</button><button class="danger" onclick="clearPK('${type}',${index})">清空這格</button></div></div>`}
function readFields(){let o={};$$('[data-k]').forEach(e=>o[e.dataset.k]=e.type==='number'?Number(e.value):e.value);return o}
function applyPK(type,index){let f=readFields(),pk=getPK(type,index);ensurePK(pk);w16(pk,8,clamp(f.species,0,65535));w16(pk,10,clamp(f.item,0,65535));w32(pk,0x10,Math.max(0,Number(f.exp)||0));pk[0x15]=clamp(f.ability,0,255);pk[0x14]=clamp(f.friend,0,255);pk[0x40]=(pk[0x40]&0x01)|((clamp(f.gender,0,2)&3)<<1)|((clamp(f.form,0,31)&31)<<3);w16(pk,12,clamp(f.tid,0,65535));w16(pk,14,clamp(f.sid,0,65535));[0x28,0x2A,0x2C,0x2E].forEach((o,i)=>w16(pk,o,clamp(f['m'+(i+1)],0,65535)));let iv=(clamp(f.iv0,0,31))|(clamp(f.iv1,0,31)<<5)|(clamp(f.iv2,0,31)<<10)|(clamp(f.iv3,0,31)<<15)|(clamp(f.iv4,0,31)<<20)|(clamp(f.iv5,0,31)<<25);iv >>>=0;iv=(iv&0x3fffffff)|(pk[0x38]&0xC0000000);w32(pk,0x38,iv);['0x18','0x19','0x1A','0x1B','0x1C','0x1D'].forEach((s,i)=>pk[Number(s)]=clamp(f['ev'+i],0,255));refresh(pk);setPK(type,index,pk);if(type==='party'){data[baseSel+0x94]=Math.max(data[baseSel+0x94],index+1);if(data.length>=0x80000)data[(baseSel===0?0x40000:0)+0x94]=data[baseSel+0x94]}render();msg('已套用修改。記得匯出存檔。')}
function setPKShiny(t,i,on){let pk=getPK(t,i);ensurePK(pk);setShiny(pk,on);refresh(pk);setPK(t,i,pk);render();msg(on?'已設為閃光。':'已取消閃光。')}
function clearPK(t,i){let pk=new Uint8Array(136);setPK(t,i,pk);render();msg('已清空。')}
window.applyPK=applyPK;window.setPKShiny=setPKShiny;window.clearPK=clearPK;
function renderBag(){let h='<div class="card"><b>背包／金錢</b><div class="muted small">HGSS 背包資料位於小區塊。可直接修改金錢與常用物品。</div><div class="grid" style="margin-top:12px">'+field('金錢','money',u32(data,baseSel+0x78),'number',0,999999)+'</div><div class="actions"><button class="primary" onclick="applyBag()">套用背包修改</button></div></div><div class="card"><b>常用物品快速新增</b><div class="grid3" style="margin-top:10px">'+[[1,'大師球'],[4,'超級球'],[13,'萬靈藥'],[17,'全滿藥'],[33,'PP最大'],[50,'神奇糖果']].map(([id,n])=>`<button onclick="addItem(${id},99)">${n}<br><span class="small">ID ${id} ×99</span></button>`).join('')+'</div></div>';$('#bag').innerHTML=h}
function applyBag(){let f=readFields();let v=Math.min(999999,Math.max(0,f.money||0));w32(data,baseSel+0x78,v);if(data.length>=0x80000){const other=baseSel===0?0x40000:0;w32(data,other+0x78,v)}render();msg('金錢已修改。')}
function addItem(id,qty){let start=baseSel+0x644;for(let i=0;i<165;i++){let o=start+i*4,cur=u16(data,o);if(cur===0||cur===id){w16(data,o,id);w16(data,o+2,qty);break}}if(data.length>=0x80000){const other=baseSel===0?0x40000:0;data.set(data.slice(start,start+165*4),other+0x644)}msg('已加入物品 ID '+id+' × '+qty)}
window.applyBag=applyBag;window.addItem=addItem;
function renderTrainer(){let nameWords=[];for(let i=0;i<8;i++){let c=u16(data,baseSel+0x64+i*2);if(c===0||c===0xffff)break;nameWords.push(c)}let h='<div class="card"><b>玩家資料</b><div class="grid" style="margin-top:12px">'+field('訓練家姓名（原始編碼）','tname',nameWords.map(x=>x.toString(16).padStart(4,'0')).join(' '),'text')+field('TID','trainerTid',u16(data,baseSel+0x74),'number',0,65535)+field('SID','trainerSid',u16(data,baseSel+0x76),'number',0,65535)+field('金錢','trainerMoney',u32(data,baseSel+0x78),'number',0,999999)+field('地圖 ID','map',u16(data,baseSel+0x1234),'number',0,65535)+field('地圖 X','x',u16(data,baseSel+0x236e),'number',0,65535)+field('地圖 Y','y',u16(data,baseSel+0x2372),'number',0,65535)+field('地圖 Z','z',u16(data,baseSel+0x2376),'number',0,65535)+'</div><div class="actions"><button class="primary" onclick="applyTrainer()">套用玩家資料</button></div></div>';$('#trainer').innerHTML=h}
function applyTrainer(){let f=readFields();let vals=[[0x74,clamp(f.trainerTid,0,65535),2],[0x76,clamp(f.trainerSid,0,65535),2],[0x78,Math.min(999999,Math.max(0,f.trainerMoney||0)),4],[0x1234,clamp(f.map,0,65535),2],[0x236e,clamp(f.x,0,65535),2],[0x2372,clamp(f.y,0,65535),2],[0x2376,clamp(f.z,0,65535),2]];for(const [o,v,n] of vals){n===2?w16(data,baseSel+o,v):w32(data,baseSel+o,v);if(data.length>=0x80000){const other=baseSel===0?0x40000:0;n===2?w16(data,other+o,v):w32(data,other+o,v)}}render();msg('玩家資料已修改。')}
window.applyTrainer=applyTrainer;
function showTab(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$$('.panel').forEach(p=>p.classList.toggle('hidden',p.id!==t));}
$$('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;fileName=f.name;const buf=await f.arrayBuffer();if(buf.byteLength<0x40000){msg('存檔太小，至少需要 256 KB。');return}data=new Uint8Array(buf);if(data.byteLength!==0x80000)msg('已載入 '+f.name+'（'+Math.round(data.byteLength/1024)+' KB），將保留原始大小。');else msg('已載入 '+f.name+'。偵測到 HGSS 512 KB 存檔。');original=data.slice();baseSel=0;selected={type:'party',index:0};$('#app').classList.remove('hidden');$('#export').disabled=false;render();};
$('#backup').onclick=()=>{if(original){data=original.slice();render();msg('已還原載入時的存檔。')}};
$('#export').onclick=()=>{if(!data)return;const blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);let ext=fileName.toLowerCase().endsWith('.dsv')?'.dsv':'.sav';a.download='promax_edited'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('已匯出 promax_edited'+ext+'。請先備份原存檔，再匯入 Delta。')};
function msg(s){$('#status').textContent=s}
</script></body></html>
